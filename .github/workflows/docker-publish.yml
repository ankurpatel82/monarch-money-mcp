name: Docker Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Connect To Docker
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER}}
        DOCKER_PASS: ${{secrets.DOCKER_PASS}}
      run: |
        docker login -u $DOCKER_USER -p $DOCKER_PASS
    - name: Build Docker Image
        run: docker build . --file Dockerfile --tag ankurpatel82/monarch-money-mcp:latest
    - name: Docker Push
        run: docker push ankurpatel82/monarch-money-mcp
