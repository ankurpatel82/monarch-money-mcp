name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
        docker login -u $DOCKER_USER -p $DOCKER_PASS
    - name: Build Docker Image
      run: docker build . --file Dockerfile --tag ankurpatel82/monarch-money-mcp:verification
